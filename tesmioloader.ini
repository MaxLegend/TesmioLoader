[tesmioloader]

; File access tracing into tesmioloader.reads.log
;   0 = off, 1 = only paths containing trace_filter, 2 = everything
trace_reads = 1
trace_filter = resourcemap

; Mirror the game's own C3DLog_Print* output into tesmioloader.log
log_game = 1

; Redirect reads to tesmioloader\vfs\<same relative path> when a file exists there
vfs = 1

; Locate the deposit map in memory by its marker, guard those pages and
; log every instruction that reads it. Diagnostic only - leave off normally.
probe_map = 0

; Watch the game read individual texels out of the deposit map textures.
probe_texel = 1

; --- plugins ---------------------------------------------------------------
;
; Everything above is compiled into tesmioloader because it is infrastructure.
; A feature does not have to be: plugins\*.dll next to the loader are scanned at
; startup, in alphabetical order, and each is handed a table of the things the
; loader knows how to do - where the executable is, how to swap an import, how
; to splice a hook, how to log, and what deposits.ini declared. Each has its own
; .ini beside it.
;
; Removing a feature is deleting its DLL. Adding one is dropping a folder in
; plugins\ and rebuilding; see docs/09-plugins.md.
;
; 0 skips the folder entirely, which is the first thing to try if the game will
; not start.
plugins = 1

; Append menu_tag to the version line along the bottom of the main menu, the one
; that reads "v1.1.1.7 (64 bit DX11.1 - GPU: ...)". Done by repointing the one
; LEA that computes that format string at a copy of it with the tag on the end,
; so nothing is hooked and no other text in the game is affected. The patch
; verifies the string the LEA currently resolves to and refuses if it is not the
; one this build ships.
menu_patch = 1

; ASCII only. This file is UTF-8 but the tag is read through the ANSI profile
; API, so anything past 0x7F would arrive as its raw bytes. Empty leaves the
; version line untouched.
menu_tag = tsmloader a0.2.
