; accumulator - stationary batteries for the electric grid. UTF-8, no BOM.
;
; Read by plugins\accumulator.dll. Deleting the DLL removes the feature; the
; battery building then still stands and still charges, it simply never gives
; anything back. Nothing here changes the save format.

[accumulator]

; 0 hooks nothing at all and unloads the plugin.
enabled = 1

; WHAT COUNTS AS A BATTERY
;
; A building of one of these types carrying an electric storage (transport class
; 9) of at least min_capacity. Nothing else in the game declares one that large:
; the base game leaves `$STORAGE RESOURCE_TRANSPORT_ELETRIC 1` commented out in
; eletric_substation.ini and never uses it anywhere, so the threshold is what
; separates a declared battery from the incidental storage a grid node carries.
;
; 19 is TRANSFORMATOR, 18 is SUBSTATION. Do not add 17 (POWERPLANT): the engine
; refuses to let a power plant *receive* energy, so one could never charge.
;
; The battery that ships with this is media_soviet\workshop_wip\9100000005 -
; "Stationary Accumulator", a type-19 node declaring 5000.
building_types = 18,19
min_capacity = 500

; HOW FAST IT FILLS, in storage units per second.
;
; This is the only thing standing between a fresh battery and a blackout. The
; grid divides what it generates by how short of capacity each receiver is, so
; an unthrottled 5000-unit battery would out-bid a whole town. The plugin lets
; the grid see a shortfall of charge_rate * one tick and no more.
;
; Compare against a power plant: the coal plant is $PRODUCTION eletric 70, the
; solar plant 70, a wind turbine 15. 60 is therefore roughly "one coal plant's
; worth of spare generation goes into the battery".
charge_rate = 60

; HOW FAST IT EMPTIES, in the same units per second, and it is a **ceiling**,
; not a rate: a battery only ever discharges into a shortfall, because the
; engine's own distributor divides by how short of capacity each consumer is and
; moves nothing when none of them is short. A healthy grid draws nothing.
;
; So this decides two things: how large an outage the battery can cover, and how
; long a full one lasts while covering it. At 60 a 5000-unit battery carries
; about one power plant for a little over eighty seconds of total blackout, and
; far longer than that against a partial shortfall - which is the usual case.
;
; Raise it to cover a bigger hole, lower it to make the charge last.
discharge_rate = 60

; Add a row to the battery's own window, under the two dials:
;
;   Charge: 4210.5 / 5000  (84.2 %)
;
; A post-hook on the panel that draws those dials. Every panel in a building
; window takes the running Y by pointer and leaves the next row's Y in it, so
; the row is drawn where the game stopped and the frame grows by one line.
panel = 1

; The caption on that row. ASCII only: this file is UTF-8, but the value is read
; through the ANSI profile API, so anything past 0x7F would arrive as raw bytes.
panel_caption = Charge

; Drive the window's two dials, and with them the "Building is without power
; supply" warning.
;
; Both are right about the grid and wrong about a battery: the solver derives
; wattage from current passing *through* a node, a battery is a dead end, and
; 0x1BD4C0 then computes voltage as 2 x wattage/breaker - so an accumulator that
; is charging perfectly well reports no power at all. With this on, the dials
; are driven from what actually moved in and out of the storage this tick, which
; is the same current a transformer passing that energy along would show.
;
; 0 leaves the engine's own numbers alone, warning included.
gauges = 1

; Hand "there is voltage here" to every building one wire away from a charged
; battery, and clear the dispatcher's unpowered flag on it.
;
; The engine propagates voltage inside a transfer, and a transfer only ever
; happens into a shortfall. On a branch fed only by a battery that deadlocks:
; the substation's storage sits full - 2.50 of 2.50 - with quality 0, so nothing
; is short, so nothing transfers, so nothing tells it the power is back. It has
; energy and no way to notice.
;
; It did not work, and it is off for that reason - not because the mechanism is
; wrong but because the timing was. Restoring a neighbour's voltage after the
; dispatcher has finished is always too late: the clearing happens again next
; tick, still ahead of the moment the neighbour would have used it. All it
; achieved was letting a substation fill its own buffer and feed nobody.
;
; The substation hook below is the same idea in the one place it works. Leave
; this at 0.
spread_voltage = 0

; KEEPING A BATTERY-FED SUBSTATION ALIVE
;
; There is no setting for this because there is nothing to tune: a substation
; wired to a charged battery has its voltage restored immediately before it
; hands its storage to the buildings it covers, and nothing else is touched.
;
; The trace is what found it. A substation covering two buildings short of 0.32
; had a voltage at the top of the tick, zero after it, and the call that would
; have fed those two buildings runs after the clearing - so it fed nobody, every
; tick, forever. A source with quality zero hands out nothing.
;
; Restoring it after the tick, which is what spread_voltage did, never helped:
; the clearing happens again next tick and still lands first. The only seam is
; between the two, and that is the substation's own distribution call.


; Follow the first battery's wired neighbours through the three phases of a
; tick - before the dispatcher, after it, after the discharge - and print
; quality, wattage, the unpowered flag, how many buildings the neighbour covers,
; and what they are short of.
;
; This is the diagnostic for "the substation takes its 2.5 and feeds nobody". It
; tells apart three different failures that look identical from the outside: the
; neighbour never getting a voltage, getting one and having it cleared again
; inside the tick, or holding one and simply having no catchment to feed.
;
; Costs one pass over a handful of buildings per tick. 0 = off.
trace = 1

; Real seconds between one line per battery in tesmioloader.log:
;
;   battery    4210.5 / 5000 (84.2 %)  in +0.417  out +0.000  this tick
;              (59.87 / 0.00 per second, dt 0.00697)
;
; 0 = off. Worth having on for the first session: the per-second figures are the
; only way to see whether charge_rate and discharge_rate are doing anything.
log_seconds = 30

; Real seconds between a dump of every building carrying an electric storage -
; type, capacity, content, quality. 0 = off.
;
; This is a reverse-engineering aid, not a feature. Turn it on when the battery
; is not being found, or when a game update may have moved the storage fields:
; the block it prints is what those offsets are checked against.
;
; It is on at 60 for now because none of these offsets has been seen in a
; running game yet - the first session with a battery in it is what confirms
; them. Set it to 0 once the log looks right.
probe = 60
