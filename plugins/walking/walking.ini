; walking - how far a citizen will walk. This file is UTF-8, no BOM.
;
; Read by plugins\walking.dll, which tesmioloader loads out of its plugins
; folder. Deleting the DLL restores the base game exactly; this file only tunes
; the feature. Nothing here changes the save format.

[walking]

; 0 leaves the game alone and the plugin unloads without patching anything.
enabled = 1

; The longest path, in metres, a citizen will accept on foot.
;
; The base game uses 480. Everything about walking in this game goes through one
; list per building - "the buildings you can reach from here on foot" - and this
; is the only number that decides what goes in it. There is no second check
; anywhere: raise this and a shop 800 m away is simply within walking distance,
; with no other consequence than more citizens on the footpaths and more
; connections to search when a building is placed.
;
; It is a path length along roads and footpaths, not a straight line, so a
; building 400 m away across a river may be 1200 m of walking.
;
; 0 removes the limit entirely - the engine reads a non-positive value as "no
; ceiling" and the search then runs until it has exhausted the road graph. It
; works, and on a large city it makes every placement take seconds. The plugin
; refuses anything past 20000 for the same reason.
distance = 1000

; The same thing for citizens who own a car: the longest drive between home,
; work and a parking lot the game will connect. The base game uses 2500 and this
; leaves it there.
;
; Worth raising alongside `distance` if you want cars to stay the long-range
; option - at distance = 2500 the two are equivalent and a car buys nothing.
car_distance = 2500

; Both distances come with a second, wider figure the game uses after a road
; changes, to decide which buildings have to have their connections rebuilt -
; 530 for feet and 2600 for cars. The plugin raises those to match whenever a
; limit above them is set, so a building 900 m from a new road still notices it.
; There is no setting for them: a rebuild radius narrower than the distance it
; serves is never what you want.

; Rebuild every walking and parking connection in the world each time a save is
; loaded, so an existing city picks up the new distance.
;
; Connections live in the save rather than being derived from the map, so
; without this only what you build after the change uses the new limit - the
; town you already have keeps the connections it was built with.
;
; This is the base game's own regeneration pass, the one it runs when it loads a
; save older than the last time the developers raised these numbers. All this
; does is make its two conditions true. Cost is a few seconds on the loading
; screen for a large city, once per load.
;
; Set to 0 if you would rather have fast loads and do not mind that the change
; only reaches new construction.
regen_on_load = 1

; Log the two patch sites and the values found in them before anything is
; written. Only useful after a game update, to see whether the addresses still
; hold what they are supposed to.
probe = 0


; NOTE
;
; The connections themselves are saved with the world. Removing the plugin, or
; lowering `distance` again, restores the limit for everything built from then
; on - but a save made while it was raised still contains the long connections
; until something regenerates them. With `regen_on_load = 1` still set that is
; the next load; without it, it is whenever a road near the pair changes.
;
; The save format is unchanged either way, so a save stays loadable with or
; without this plugin - unlike a resource being added.
