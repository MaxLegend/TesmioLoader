; needs - resources the citizens require. UTF-8, no BOM.
;
; Read by plugins\needs.dll, and it is the whole of that feature's
; configuration: [list] is what the citizens want, [needs] is how the plugin
; reaches the engine. Deleting the DLL removes the extra needs entirely - the
; base game's four are untouched either way.
;
; SAVES. A need adds a slot to every shop storage that stocks its donor, and a
; storage's slot list is part of the save. Test on a copy before committing a
; long game to it, exactly as with plugins\resources.ini.


; ---------------------------------------------------------------- what is wanted

;   <resource> = <donor>[, <factor>[, <category>[, <chance>[, <unhappiness>]]]]
;
; resource  What the citizens are to want. Any name the engine knows - a
;           base-game resource, or one declared in plugins\resources.ini. Its
;           transport class has to be one the donor's shops can carry, which it
;           is automatically when the resource was cloned from the donor in
;           resources.ini.
;
; donor     An existing citizen demand, and the key that drives both halves of
;           the feature:
;
;             the demand   is a byte-for-byte clone of the citizen's demand for
;                          the donor, with only the resource and the amounts
;                          changed - so it is routed to exactly the shops that
;                          already sell the donor.
;             the storage  slot is added to every storage the donor ended up in
;                          and this resource did not, which is those same shops.
;
;           Use `food` or `meat` for a grocery good, `clothes` or `eletronics`
;           for a department-store good. Note the game's own spelling of
;           "eletronics".
;
; factor    How much of it, against what the donor demand asked for. 1.0 means
;           a citizen wants as much of it as they want electronics. Default 1.0.
;
; category  Which kind of shop stocks it, by the $STORAGE_DEMAND_* token the
;           building declared. The plugin reads that token out of the storage
;           itself, so this is the game's own classification and not a guess:
;
;             auto            wherever the donor landed. The default, and right
;                             most of the time - the donor already implies a
;                             category
;             basic           $STORAGE_DEMAND_BASIC          food, meat
;             medium          $STORAGE_DEMAND_MEDIUM         food, clothes
;             advanced        $STORAGE_DEMAND_ADVANCED       food, clothes, eletronics
;             mediumadvanced  $STORAGE_DEMAND_MEDIUMADVANCED clothes, eletronics
;             hotel           $STORAGE_DEMAND_HOTEL          food, alcohol, meat
;             <number>        a raw token, for the few the base game barely uses
;
;           It only ever *narrows* the donor rule. `eletronics` lands in both
;           advanced and mediumadvanced shops; naming `advanced` puts the goods
;           in the big department stores only, which is the thing the donor on
;           its own cannot say.
;
;           Choosing a category whose shops do not sell the donor is allowed and
;           logged as a WARN: the goods would sit where no citizen walks for
;           them, because it is the donor - not the category - that decides
;           where the demand sends them.
;
; chance    0..1, how often a citizen takes the need up at all. Default 1.0.
;
;           **This is what makes the need independent of its donor.** The first
;           time the plugin sees a real donor demand it keeps a copy, and from
;           then on it can give the need to a citizen who is not asking for the
;           donor today. Without it a citizen wants furniture exactly when they
;           want electronics and never otherwise; with `chance = 0.3` roughly
;           three citizens in ten take it up on any given planning cycle,
;           whatever they think of electronics.
;
;           The copy carries the amounts of whichever citizen it came off -
;           their age and family - so `factor` is still what sets the size.
;           Routing is identical for everyone shopping for the same goods.
;
; unhappy   How much happiness one unmet cycle costs, 0..1. Default 0, which
;           means the need is reported and nothing more.
;
;           A cloned demand has no status float of its own - all eleven at
;           person+0xD8 are spoken for - so this subtracts from happiness
;           directly, which is what the game itself does at 0x836DA9, clamped
;           at zero the same way. What counts as "unmet" is the planner's own
;           record: the resource being in the citizen's unsatisfied list at
;           person+0x4F0, which means they went shopping and came back without
;           it.
;
;           For scale, the base game takes 0.035 per cycle off a citizen whose
;           clothing has fallen through the lower of its two thresholds, and
;           less above it. Start around 0.005-0.02 for a comfort good.
;
; At most eight entries, and see max_demands below for the ceiling that really
; matters.

[list]

; Furniture: a department-store good. `furniture` is declared in
; plugins\resources.ini as a clone of eletronics, which gives it
; RESOURCE_TRANSPORT_COVERED, and its icon goes in
; tesmioloader\vfs\media_soviet\resources\furniture.png.
furniture = eletronics, 1.0, advanced, 0.35, 0.010


; ---------------------------------------------------------------- the plugin

[needs]

; 0 unloads the plugin entirely.
enabled = 1

; Append the need to a citizen's demand list. Post-hook on the daily planner at
; rva 0x836960. Turn off to leave citizens alone and only stock the shops.
demand = 1

; Add the resource to every storage that stocks its donor. Post-hook on the
; storage builder at rva 0xE40F0, which runs while building.ini is parsed.
; Turn off if the shops are to be stocked some other way - without it the
; citizens will want the goods and never find them.
storage = 1

; How many demands a citizen may carry at once.
;
; **7 is a hard ceiling, not a preference.** The demand array starts at
; person+0x118 with a stride of 0x80 and the unsatisfied-demand count sits at
; person+0x4F0, so an eighth entry would run over it. A larger number here is
; clamped back to 7; a smaller one leaves the base game more headroom at the
; cost of the new need being skipped more often.
max_demands = 7

; What to do when the citizen already has max_demands.
;
;   skip     leave them alone this cycle. The need appears on the next plan
;            that has room, which is most of them - a citizen with an urgent
;            food demand carries no service demands at all and sits at four.
;   replace  take the donor's own entry for this cycle, so the citizen shops
;            for one of the two goods today and the other tomorrow.
when_full = skip

; Diagnostics. Dumps the first few citizens' whole demand lists and status
; blocks, and one line per storage the builder passed through - its
; $STORAGE_DEMAND_* token, transport class, capacity, slot count, and whether
; the donor and this resource were found in it. That last line is the one that
; tells a storage which was deliberately passed over from a hook that never
; ran, so leave it on until the shops are stocked.
probe = 1

; Seconds between the "N demand(s) added" progress lines. 0 turns them off.
log_seconds = 60
