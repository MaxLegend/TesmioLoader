; deposits - deposit types the base game does not have. UTF-8, no BOM.
;
; Read by plugins\deposits.dll, and it is the whole of that feature's
; configuration: [deposits] is what the plugin is allowed to touch, and every
; other section is a deposit. Adding one is adding a section - no source change,
; and the same table drives all three subsystems: the code patch that teaches
; the engine the type, the minimap layer, and the terrain editor's brush.
;
; Deleting the DLL removes mod deposits entirely - and with them the registry
; other plugins read, so depletion falls back to the base game's own five.


[deposits]

; Splice the declared deposit types into the executable, so their tokens work in
; building.ini and their mines find and size their deposits. This is the only
; part of the project that emits instructions; it verifies all three sites
; against the bytes v1.1.1.7 ships and refuses as a whole if any differs.
code_patch = 1

; Add a minimap button and overlay layer per deposit that asks for one, below
; the base game's five. Purely additive inline hooks on the button-row and
; overlay-draw functions; the vanilla buttons are untouched.
minimap = 1

; Add a paint/erase pair per deposit that asks for one to the terrain editor's
; Resources tab. Four additive inline hooks; the engine's own brush does the
; work, so no code is patched.
editor = 1


; ---------------------------------------------------------------- the deposits
;
; One section per deposit. The section name is the deposit's name; "deposits" is
; the one name it may not have, because that section is the settings above.
;
;   token          The building.ini token that selects this deposit, e.g.
;                  $TYPE_MINE_COPPER. Required. Use it in a mine's building.ini
;                  exactly like $TYPE_MINE_BAUXITE.
;
;   type           The deposit type number the engine keys everything on.
;                  Required, and must be 10 or above: 0-9 belong to the base
;                  game. The upper bound is 127, because every comparison the
;                  patch splices in takes a sign-extended imm8.
;
;   map            resourcemap or resourcemap2. Both are 1024x1024 BGRA textures
;                  that ship with every terrain; the game keeps one deposit per
;                  colour channel and stores richness as the byte value. Default
;                  resourcemap2.
;
;   component      0-3, which channel of that map. Required.
;
;   building_type  What the parser sets alongside the deposit type. 7 is a mine,
;                  which is almost certainly what you want; water wells are 92.
;                  Default 7.
;
;   radius         How far the mine searches for its deposit. Naming one of the
;                  game's own constants - oil, ore, bauxite, gravel, wood, water,
;                  watersurface - copies its value at startup, so the mod tracks
;                  the game if a patch ever changes it. A number is taken
;                  literally. Default ore, which iron, coal and uranium share.
;
;                  This is not optional in practice. A type the radius table
;                  does not know searches nothing, the average over an empty set
;                  is NaN, and the building window shows quality of source as
;                  -2147483648.
;
;   icon           Resource whose icon the minimap button uses, taken straight
;                  out of its record - so a resource declared in
;                  plugins\resources.ini needs no extra art. Omit for no icon.
;
;   minimap        1 to add a minimap button and overlay layer, 0 for none.
;                  Default 1.
;
;   editor         Base name for the terrain editor's paint/erase pair:
;                  "copper" gives paint_copper and erase_copper, drawn with
;                  vfs/media_soviet/editor/tool_paint_copper.png and
;                  tool_erase_copper.png. Omit for no brush.
;
;                  At most SEVEN characters. The tool name is written over a
;                  clone of paint_bauxite's, and a longer string would not fit
;                  the descriptor field.
;
;   deplete        Read by the depletion plugin, not by this one, which keeps it
;                  verbatim and hands it over through the deposit service. A
;                  number is the tonnes of mine output one fully saturated texel
;                  of this deposit is worth, overriding tonnes_per_texel in
;                  plugins\depletion.ini; 0 exempts the deposit and leaves it
;                  infinite. Omit to take the global figure.
;
;
; WHICH CHANNELS ARE ACTUALLY FREE
;
; Eight exist. Measured over every shipped map - campaign1, campaign2,
; terrain3-6, terrain_svk, terrainblank and all eighteen tutorial maps:
;
;   resourcemap  component 0   oil        taken
;   resourcemap  component 1   iron       taken
;   resourcemap  component 2   coal       taken
;   resourcemap  component 3   -          FREE, but see below
;   resourcemap2 component 0   uranium    taken
;   resourcemap2 component 1   bauxite    taken
;   resourcemap2 component 2   -          carries data on about half the maps,
;                                         and the minimap has a sixth layer flag
;                                         for it with no button. Avoid.
;   resourcemap2 component 3   copper     taken by the section below
;
; resourcemap component 3 holds no spatial data on any shipped map: it is either
; all 255 or all 0, never anything in between, which is what an unused alpha
; channel looks like. It is usable, with one caveat - on the maps where it is
; 255 a deposit assigned to it reads as maximum richness everywhere until
; something clears it. Paint over it in the editor, or ship a replacement map
; through the VFS.
;
; Past those two there are no channels left, and a third resource map would have
; to be created and saved by the loader itself.

[copper]
token         = $TYPE_MINE_COPPER
type          = 10
map           = resourcemap2
component     = 3
radius        = ore
building_type = 7
icon          = copper_ore
minimap       = 1
editor        = copper
