; depletion - deposits that run out. This file is UTF-8, no BOM.
;
; Read by plugins\depletion.dll, which tesmioloader loads out of its plugins
; folder. Deleting the DLL removes the feature entirely; this file only tunes
; it. Nothing here changes the save format - but see the warning at the end.

[depletion]

; 0 is the vanilla game: a deposit is infinite, a mine samples it once when it
; is built and produces at that rate forever. 1 makes a working mine take its
; output back out of the deposit map itself, and re-derive its quality of source
; from what is left every `resync` seconds.
;
; At 0 the plugin hooks nothing at all and unloads.
enabled = 1

; What one fully saturated texel of a deposit map is worth, in tonnes of mine
; output. This is the main balance knob: larger means deposits last longer.
;
; A texel is one pixel of a 1024x1024 map stretched over the whole terrain, and
; an ore mine searches a radius of 210 world units, so its footprint is a few
; thousand texels - the log prints the exact count and the resulting reserve for
; every mine the first time it is sampled. Start from those numbers.
tonnes_per_texel = 1200

; Which of the base game's deposits run out: oil, iron, coal, uranium, bauxite,
; gravel - or "all", or "none". A name may carry its own figure per texel after
; a colon, overriding tonnes_per_texel for that one deposit.
;
; Anything declared in deposits.ini is always included; give a section its own
; "deplete = 0" to exempt it, or "deplete = <tonnes>" for its own figure.
;
; Wood and water are not on the list at all - the engine already regrows and
; refreshes those.
;
; GRAVEL IS NOT LIKE THE OTHERS. It is the one deposit that does not live in a
; resource map: it is component 2 of the terrain's own mask texture, the same
; one the editor's material brush paints. Working a gravel pit down therefore
; wears the ground texture away under it, visibly and permanently. That is what
; a gravel pit looks like, but it is a change to the terrain rather than to an
; invisible channel - drop the word to keep the base game's behaviour.
;
; Gravel also has a search radius of 30 against an ore mine's 210, so its
; footprint is a few dozen texels instead of a couple of thousand and it needs a
; far larger figure per texel to last a comparable time. 30000 is a starting
; guess; the log prints the reserve it works out to.
vanilla = oil,iron,coal,uranium,bauxite,gravel:30000

; Real seconds between writing accumulated depletion back into the deposit map.
;
; Not a simulation setting - production and quality of source follow the
; extraction continuously, every tick. This only decides how often the map
; itself catches up, which is what the minimap overlay shows and what a save
; contains.
;
; It is deliberately not zero. Writing the map means
; ID3D11DeviceContext::Map on a staging copy of the whole 1024x1024 texture and
; a CopyResource back afterwards, so it is done once for every mine at once,
; from the render thread, and no more than four times a second whatever this
; says. See docs/08-depletion.md for why that matters.
flush_seconds = 5

; Real seconds between progress lines in tesmioloader.log, per mine. 0 = off.
;
; At the default tonnes_per_texel a mine holds years of in-game output, so
; nothing visibly moves on the minute scale and it is hard to tell a working
; plugin from an idle one. This prints the numbers:
;
;   deplete  coal mine: 99.86% left, 258926 of 259289 t, quality 0.686
;
; It is also how tonnes_per_texel gets calibrated - watch the percentage over a
; few in-game days and scale until a mine lasts as long as you want it to.
log_seconds = 60

; Add a row to the mine's own information window, under "Current production per
; workday", reading e.g.
;
;   Deposit remaining: 251.4 kt / 259.3 kt  (96.9 %)
;
; A post-hook on the panel builder at rva 0x786AC0. The game leaves the panel's
; bottom edge in a field of the window object; the row is drawn there and the
; edge moved down by one line, so the window grows to fit instead of the text
; landing on the frame. Nothing the game draws is touched.
panel = 1

; The caption on that row. ASCII only: this file is UTF-8 but the value is read
; through the ANSI profile API, so anything past 0x7F would arrive as its raw
; bytes - the same constraint as menu_tag in tesmioloader.ini.
panel_caption = Deposit remaining


; WARNING
;
; Depletion lowers the terrain's own resourcemap, and the world writer saves it.
; Setting enabled = 0 afterwards, or deleting the plugin, does not restore what
; was mined - the save format is unchanged, but the map inside it is not. Test
; on a copy of a save you care about.
