; buildings - new buildings, declared instead of hand-built. UTF-8, no BOM.
;
; Read by plugins\buildings.dll. Every section that is not [buildings] is one
; building: it names a base-game building to clone, the building.ini lines that
; are to be different, and nothing else. At startup - before the game has read
; its first file - the plugin writes the whole Workshop item out to
; media_soviet\workshop_wip\<id>\, assets included.
;
; This plugin patches nothing. It reads no game structure and installs no hook,
; so there is no address in it that a game update can invalidate. What it can
; break is a building.ini, and the game says so in its own log.
;
; THE ONE THING IT PUTS ON DISK. Every generated folder carries a
; tesmioloader.stamp, and a folder without one is never touched - so an id that
; collides with a real Workshop subscription is refused rather than
; overwritten. Nothing the game shipped is modified, so Steam's verification
; stays happy. Delete a folder to have it written again.


; ---------------------------------------------------------------- the plugin

[buildings]

; 0 unloads the plugin - the folders it wrote last time stay where they are and
; the game keeps loading them. Delete them by hand to be rid of the buildings.
enabled = 1

; Where the items go, relative to the game folder. workshop_wip is the folder
; the game scans for unpublished Workshop items.
out = media_soviet\workshop_wip

; 1 rewrites every folder on every launch. 0 - the default - only rewrites when
; the section, the generator or the donor's own building.ini changed, which is
; what keeps a 300 KB mesh from being copied at every start.
always = 0

; One line per file copied and per donor line dropped. Long, and the fastest
; way to see why a building came out the way it did.
verbose = 0


; ---------------------------------------------------------------- how a section reads
;
;   id      the Workshop item id, and the folder name. Any number; 91000000xx
;           is what this project uses to stay clear of real Workshop ids.
;   donor   a name under media_soviet\buildings_types\ - the building whose
;           mesh, textures, collision box, fire points, icon and building.ini
;           are the starting point. **Match the shape, not the looks**: a mine
;           wants a mine (animation, conveyor output), a shop wants a shop.
;   object  the object subfolder, and what $OBJECT_BUILDING names. Defaults to
;           the section name.
;   name    $NAME_STR, and the name in the build menu. A literal, so no
;           language file has to be touched. ASCII.
;   desc    the Workshop description. Repeatable - each line is one line.
;   life    renderconfig LIFE. Default 3000.
;   enabled 0 skips this section.
;
;   line    **a building.ini line, verbatim.** Repeatable, emitted in order.
;           This is the whole of the economy: whatever a building.ini can say,
;           say it here.
;   strip   a $TOKEN to take out of the donor without putting anything back.
;           Repeatable.
;
; WHAT A DECLARED LINE TAKES OUT OF THE DONOR
;
; The donor's file is copied line for line - every $CONNECTION_*, $COST_WORK*,
; $VEHICLE_STATION, $PARTICLE and $TEXT_CAPTION is measured against the mesh and
; must survive - and a line is dropped only when a declared line replaces it.
;
; Most tokens replace only themselves. Four families replace each other:
;
;   $NAME and $NAME_STR
;   every $TYPE_*                              only one may be in effect
;   every $STORAGE* and $RESOURCE_VISUALIZATION  the visualisation counts
;                                                storages from zero, so
;                                                re-declaring them moves piles
;   $PRODUCTION, $CONSUMPTION, $CONSUMPTION_PER_SECOND - a recipe goes whole
;
; Exactly those three recipe tokens by name: $PRODUCTION_SEWAGE_POLLUTION and
; $CONSUMPTION_WATER_REQUIRED_QUALITY are settings and survive a new recipe.
;
; The first $TOKEN **anywhere** in a line is what counts, because that is what
; the game's own parser matches - `//$WORKERS_NEEDED 13` is a $WORKERS_NEEDED,
; a building.ini has no comment syntax. Lines here are read the same way, so
; never write a $TOKEN inside a `;` comment in a section.


; ---------------------------------------------------------------- the pharmacy
;
; A shop that sells one thing. `medicine` is declared in plugins\resources.ini
; as a clone of eletronics - which is what gives it RESOURCE_TRANSPORT_COVERED,
; the class the shelf below declares - and in plugins\needs.ini as a fifth thing
; the citizens want.
;
; $STORAGE_SPECIAL is the storage that holds exactly one named resource, and it
; is what makes this a pharmacy rather than a department store with an extra
; shelf. The sale itself needs nothing else: the shop tick walks **every**
; storage of a $TYPE_SHOP building and moves goods across whenever a slot's
; resource matches a customer's demand - it never asks which $STORAGE_* token
; built the storage. The pub does the same with alcohol.
;
; The medicine need is declared with category `none` in needs.ini for the same
; reason - the shelf is in this file, so nothing should sprinkle medicine into
; the department stores as well.

[pharmacy]
id     = 9100000010
donor  = shop_clothes
object = Pharmacy
name   = Pharmacy
desc   = A chemist's shop. Sells medicine, and nothing else.
desc   =
desc   = Medicine is a resource tesmioloader adds in plugins/resources.ini as a
desc   = clone of eletronics; the needs plugin makes citizens want it and this
desc   = building is where they buy it. Supply it the way a gas station is
desc   = supplied - a distribution office, or a truck.
desc   =
desc   = Geometry, textures, collision and fire data are the base game's clothes
desc   = shop, used here as a placeholder. Local test item - not for publishing.

line   = $TYPE_SHOP
line   = $WORKERS_NEEDED 8
line   = $CITIZEN_ABLE_SERVE 6
line   = $STORAGE_SPECIAL RESOURCE_TRANSPORT_COVERED 8 medicine

; If it turns out citizens will not walk to a shop that stocks only a modded
; good, this is the fallback: make it a department store that also sells
; medicine, and set `medicine`'s category in needs.ini to `advanced`.
;
;   line   = $STORAGE_DEMAND_ADVANCED RESOURCE_TRANSPORT_COVERED 12


; ---------------------------------------------------------------- and where it comes from
;
; The fabric factory already turns plants and chemicals into a covered good over
; two import storages and a water line. Only the recipe changes, which is what
; four `line` keys say and the reason this section is as short as it is - the
; donor's storages, sewage line, water-quality requirement, connections and
; construction phases are all still its own.

[pharmaceutical_plant]
id     = 9100000011
donor  = fabric_factory
object = PharmaceuticalPlant
name   = Pharmaceutical Plant
desc   = Turns chemicals and plants into medicine.
desc   =
desc   = Cloned from the base game's fabric factory: same building, same water
desc   = and sewage lines, different recipe. Local test item - not for
desc   = publishing.

line   = $TYPE_FACTORY
line   = $WORKERS_NEEDED 60
line   = $PRODUCTION medicine 0.02
line   = $CONSUMPTION chemicals 0.02
line   = $CONSUMPTION plants 0.05
line   = $CONSUMPTION water 0.08
line   = $CONSUMPTION_PER_SECOND eletric 0.15
