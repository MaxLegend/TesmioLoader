; resources - resources the base game does not have. UTF-8, no BOM.
;
; Read by plugins\resources.dll, and it is the whole of that feature's
; configuration: [list] is what exists, [resources] is how the plugin reaches
; the engine. Deleting the DLL removes mod resources entirely.
;
; SAVES ARE NOT COMPATIBLE ACROSS CHANGES TO [list]. The resource count is part
; of the save format: a save written with two mod resources will not load
; without them, and a stock save will not load with them.


; ---------------------------------------------------------------- what exists

;   <name> = [<slot index>,] <template resource | custom>[, <display name>]
;
; slot     Optional, and better left out. The engine keeps its resources in one
;          global std::vector; the plugin waits until every base-game record has
;          landed and then claims the slots after them, in the order the entries
;          appear here. Writing a number instead pins the slot and is refused
;          unless it is exactly the next free one - which is what makes a
;          hard-coded 57 break the moment anything else claims it first.
;          There is no ceiling on how many entries this section may have: the
;          engine's own allocation runs to 63 records, and the plugin moves the
;          array to a bigger block as soon as [list] needs more. See
;          resource_capacity below.
;
; template An existing resource whose record is copied in as a starting point; a
;          freshly claimed record is otherwise all zeroes. Match the transport
;          class to what you intend - a storage whose class differs from the
;          resource's own reports zero capacity.
;
;          Or the word `custom`, which means there is no donor at all: the
;          record is built from a zeroed one out of the [custom:<name>] section
;          further down. Both forms work and always will; a template is the
;          short way to get a resource that behaves like an existing one, and
;          `custom` is the way to get one that behaves like nothing in the game.
;
; display  Caption shown in the interface. The plugin mints a private
;          localisation id for it and answers C3D_LANGUAGE::GetString itself, so
;          no language file has to be touched. Omit to keep the template's - or,
;          on a `custom` entry, to be called by its own name, since a record
;          built from zero has no caption to inherit.
;
; The name is also what building .ini files use in $PRODUCTION / $CONSUMPTION /
; $STORAGE lines.

[list]
copper_ore         = rawiron, Copper Ore
copper_concentrate = bauxite, Copper Ore Concentrate
raw_copper         = steel, Raw Copper
copper             = aluminium, Copper
furniture          = eletronics, Furniture
gas         	   = oil, Gas
sand         	   = bauxite, Sand
clay                = bauxite, Clay
glass                = eletronics, Glass

; Sold in the pharmacy that plugins\buildings.ini declares. Cloned from
; eletronics for the transport class - RESOURCE_TRANSPORT_COVERED is what the
; shop shelf declares - and, like eletronics, it has no cargo geometry in the
; base game at all, so the only asset it needs is
; tesmioloader\vfs\media_soviet\resources\medicine.png.
medicine             = eletronics, Medicine

; A resource with no donor at all. Commented out because adding it changes the
; resource count, and the resource count is part of the save format - a save made
; without it will not load with it. Uncomment both this line and the
; [custom:hydrogen] section below together.
; hydrogen           = custom, Hydrogen


; ------------------------------------------------------------- a record from scratch
;
; [custom:<name>] is one resource's record, field by field. It is read for any
; name in [list], so it does two jobs:
;
;   - on an entry declared `custom`, it is the whole of what the resource is;
;   - on an entry with a template, it corrects single fields of the clone -
;     `[custom:copper_ore]` with one `kind = 1` line, and everything else stays
;     rawiron's.
;
; Every field defaults to something a base-game resource really carries, so a
; section with nothing but `transport =` in it produces a working resource. The
; whole 832-byte record only holds 30 bytes of per-resource content; what is not
; listed here is zero in all 57 base-game records and filled by the engine at
; runtime (the icon, the previous price, the cargo meshes).
;
;   transport = <class>[, <factor>[, <f1>, <f2>[, <flag>]]]
;                             THE ONE LINE THAT MATTERS. Which transport class
;                             carries this resource, by name (covered, open,
;                             gravel, oil, cement, cooler, livestock, passanger,
;                             concrete, eletric, vehicles, general, nuclear1,
;                             nuclear2, heating, water, sewage, waste), by the
;                             game's own token (RESOURCE_TRANSPORT_GRAVEL), or by
;                             number 0..17. Without it nothing can carry the
;                             resource and every storage naming it reports
;                             0.00 of 0.00 t. Bare, the class's figures come from
;                             what the base game uses for that class - see
;                             `class` below for what they mean and for the
;                             numbers, which are the same here.
;
;   class = <class>[, <factor>[, <f1>, <f2>[, <flag>]]]
;                             A second, third ... class, repeatable. Bare, it
;                             takes the base game's numbers for that class -
;                             except `general`, which mirrors whatever
;                             `transport` named, because that is what ten of the
;                             twelve base-game resources with a second class do.
;                             The lines are applied in the order they appear, so
;                             `transport` has to come first for that mirror to
;                             have anything to copy - and a later line wins over
;                             an earlier one wherever they overlap.
;                             factor is the storage-capacity multiplier (record
;                             +0xCC + class*0x20, proven: the building.ini parser
;                             multiplies a $STORAGE capacity by it). f1 and f2
;                             are two figures the base game sets per class and
;                             whose readers have not been found - GRAVEL 0.5/30,
;                             OPEN 1.25/2.5, OIL 5/5, CONCRETE 5/20. flag is the
;                             byte the customhouse sync reads as "not tradeable
;                             in this class"; the base game only ever sets it on
;                             a second class.
;
;   kind = 0                  Record +0x44, the price kind the engine's own price
;                             pass branches on: 0 raw, 1 manufactured, 2 food and
;                             clothes, 3 meat/asphalt/concrete/components, 4
;                             eletronics. Negative values are the five the pass
;                             special-cases (-1 workers .. -5 heat) and are not
;                             for a mod resource.
;
;   price      = <rub>[, <usd>]   +0x58/+0x5C. The engine's price pass overwrites
;                             both for every kind but -1, so this is a starting
;                             value; [price] below is what survives a recompute.
;   base_price = <rub>[, <usd>]   +0x78/+0x7C, the raw-material value the solver
;                             starts from. [base_price] below is the pinned form.
;
;   trade_mult = 0.95, 1.05   The sell and buy multipliers the trade window
;                             quotes the price by. Every base-game resource that
;                             can be traded at all carries exactly these two.
;   market_rub = 200, 350[, 0.5]
;   market_usd = 500, 500[, 0.5]
;                             Two large figures and a coefficient per market
;                             block (+0x88 and +0xA8). The base game ranges from
;                             25/30 on waste_toxic to 40000/60000 on eletric, and
;                             twelve resources including every waste carry
;                             exactly the defaults above. Which block is which
;                             currency follows the order of the price pair and
;                             nothing stronger.
;
;   packed = auto             +0xC8, one byte. `auto` sets it for a primary class
;                             of covered, cooler, nuclear1 or nuclear2 - the rule
;                             that reproduces all 57 base-game records exactly.
;                             Those are the fifteen goods a lorry carries as a
;                             crate and the fifteen with no cargo mesh of their
;                             own. What reads the byte is not established.
;
;   family = none             +0x30C. The base game's material families, 10..19,
;                             each holding exactly one waste resource: gravel,
;                             steel, aluminium, plastic, bio, food, burnable,
;                             toxic, other, ash. Takes one of those names, a
;                             number, or `none` (-1), which is what workers,
;                             eletric, heat, water and usagewater carry. What
;                             reads it is not established either - the sorted-
;                             waste mapping is the obvious candidate.
;
;   cargo = auto              Which cargo geometry to load: none, bulk (four pile
;                             stages <name>1..4.nmf plus <name>_vehicle.nmf),
;                             open (one <name>.nmf laid out on a grid), or auto -
;                             the files that are actually there for a record with
;                             no template, the template's own slots for a clone.
;
;   field = <off>, f|i|b, <v> The escape hatch: writes a float, an int or a byte
;                             anywhere in the 832 bytes. This is how the fields
;                             whose meaning is not established are reachable
;                             without inventing names for them - `field = 0x50,
;                             f, 84` is what waste_toxic carries there.
;                             docs/02-findings.md lists every offset.

; The worked example, and it is deliberately unlike anything in the base game: a
; gas that travels in a tank like oil, is worth something, produces no waste and
; has no cargo model at all. Nothing is cloned - every figure below either comes
; from this section or is the plugin's own default.
;
; [custom:hydrogen]
; transport  = oil
; kind       = 1
; price      = 180, 150
; market_rub = 400, 600
; market_usd = 500, 700
; family     = none
; cargo      = none


; ---------------------------------------------------------------- what it costs
;
; Both sections take   <resource> = <rubles>[, <dollars>]
; and one number sets both currencies, which is what most of the base game's own
; base prices do. The name may be a mod resource or a base-game one - these are
; keyed by name and looked up in the engine's vector, so retuning `rawiron` here
; works exactly as well as pricing `sand`.
;
; THE GAME DOES NOT STORE A PRICE PER RESOURCE. It computes one, once per world
; load and again whenever the economy updates, by walking the building types
; looking for whatever produces the resource and adding up what that costs. Read
; both sections below with that in mind.

; --- [base_price] -----------------------------------------------------------
;
; The `$Economy_BaseRUB` / `$Economy_BaseUSD` a save writes into its stats.ini,
; and an *input* to that computation rather than a result. Fifteen base-game
; resources have one and they are the ones that come out of the ground or cannot
; be produced at all: rawiron 4.5, rawcoal 5.3, oil 40, wood 7.5, uranium
; 5.2/4.2, explosives 15/13, water 0.3/0.2.
;
; Set it on an ore and everything downstream of that ore gets dearer, because
; the mine's output is priced from it and the concentrator's from the mine's.
; `copper_ore` already has 4.5 without asking, because it is cloned from
; `rawiron` and a clone copies the whole record.
;
; **On its own this does not lift a resource off zero.** The solver returns zero
; before it ever reads the base when no building type produces the resource -
; see [price] below.
;
; A value declared here is pinned: it is written back before every recompute, so
; neither the save nor the twice-a-period drift the engine applies to base
; prices moves it again.

[base_price]
; copper_ore = 6.0, 5.0


; --- [price] ----------------------------------------------------------------
;
; The finished price, forced after the engine has computed its own. This is the
; number the trade window quotes: it shows this times 1.05 to buy and times 0.95
; to sell, and every other screen that puts a rouble figure on a resource
; divides the same way.
;
; **This is the half that fixes a zero.** A resource that nothing produces -
; declared in [list] and used by no building's $PRODUCTION - prices at 0.00
; however large its base is, and forcing the price is the only thing that gives
; it a value. A resource that *is* produced does not need this: leave it out and
; the chain prices it, which is what `copper` and `furniture` already do.
;
; Forced means forced. The value is rewritten after every recompute, so it never
; drifts and never responds to the chain that makes it.

[price]
; sand  = 12.0, 10.0
; clay  = 14.0, 12.0
; glass = 260.0, 300.0
; gas   = 46.0, 50.0


; ---------------------------------------------------------------- the plugin

[resources]

; Inline hook on the game's resource-name resolver.
;   0 = off, and the plugin unloads
;   1 = observe only  - record every name and the index it resolved to, into
;                       tesmioloader.resources.log
;   2 = observe + inject - additionally answer the names in [list] above
hook = 2

; Entry point of ResourceGet, relative to the SOVIET64.exe image base.
; Verified against a known prologue at install time; a mismatch aborts the hook.
; v1.1.1.13; was 0x2AA830 in v1.1.1.9.
resource_rva = 0x2AA7B0

; The global std::vector<Resource> that bounds every lookup. The plugin refuses
; to touch it unless its begin pointer matches the array it discovered at
; runtime.
; .data, unchanged since it was first found.
resource_vector_rva = 0x9E11C0

; A floor on how many records the resource array should have room for.
;
;   0   the default - the plugin works the number out from [list] and grows the
;       array whenever the engine's own allocation is too small. Nothing here
;       has to be kept in step with how many names are declared above.
;   N   the same, but never fewer than N records. Only useful for leaving
;       headroom before adding names.
;  -1   never move the array. Six mod resources fit in the engine's own 63
;       records and the seventh is refused, which is what every version before
;       this one did.
;
; Growing it is a reallocation done the way reserve() would: a bigger block from
; the process heap, the existing records copied in, and the vector's three
; pointers repointed at it. The engine reads only those pointers, so it never
; notices, and it reuses the buffer across worlds - a world change clears the
; vector rather than destroying it - so this happens once per session however
; many maps are loaded. The old block is left allocated on purpose.
;
; It is done on the very first lookup, ahead of the forty records the engine
; resolves by name and caches for itself immediately after building the array;
; that cache sits directly behind the vector and is carried across as well.
;
; Caveat worth knowing: the resource vector is not the only table indexed by
; resource number. Growing this array lets more resources exist; it does not
; make any other table bigger. See docs/04-adding-resources.md.
resource_capacity = 0

; The bracket around the engine's price pass - the loop that recomputes every
; resource's price from the production chains. Base prices are written before it
; runs and forced prices after, so both survive a save and the engine's own
; drift. 0 turns it off and [base_price] / [price] do nothing.
;
; Needs `hook = 2`: the two money sections are read alongside [list].
price_hook = 1

; Print every declared resource's price after each recompute, into
; tesmioloader.log:
;
;   price     sand                       0.00 RUB       0.00 USD   base 0.00 / 0.00   kind 0
;   price     copper_ore                 7.09 RUB       7.88 USD   base 4.50 / 4.50   kind 0
;
; Which is the one thing that answers "why is this one zero": a price of 0.00
; means no building type produces the resource, whatever its base says. The pass
; runs a handful of times a session, so this is not a per-tick cost.
price_report = 1

; Entry point of the price pass, relative to the image base. Verified against a
; known 14-byte prologue at install time; a mismatch refuses the hook.
; v1.1.1.13; was 0x2A9340 in v1.1.1.9.
price_pass_rva = 0x2A92C0

; Print the record every published resource actually ended up with - its kind,
; prices, both market blocks and every transport class it carries:
;
;   record    "hydrogen" kind 1  price 180.00/150.00  base 0.00/0.00  packed 0 ...
;   record    "hydrogen" market rub  sell 0.95 buy 1.05  400 / 600  k 0.50
;   record    "hydrogen" class oil       [ 3] factor 1.000  5.00 / 5.00  0.05 / 0.05  flag 0
;
; A resource declared `custom` prints this always - there is no donor to compare
; it against, so the log is the only way to see what was built. This switch adds
; the same block for the template-based ones, which is how you find out what a
; clone really inherited.
custom_report = 0


; ---------------------------------------------------------------- customs
;
; A customhouse's trade storages are plain $STORAGE lines with no resource
; named, and the game builds their slot list exactly once, while its
; building.ini is parsed - which means a customhouse already standing (or
; built in an earlier session) never sees a resource [list] above declares
; afterwards, even though it is otherwise perfectly tradeable. This re-syncs
; every standing customhouse's trade slots against the live [list] the first
; time each one ticks after this plugin loads. See CUSTOMS in resources.cpp.

[customs]

; 0 leaves customhouses trading only what they could trade when they were
; built - exactly like the base game. Demolishing and rebuilding an affected
; customhouse is still the manual fix while this is off.
hook = 1

; Entry point of the customhouse's own tick, building type 20
; (BUILDINGTYPE_CUSTOMHOUSE). Verified against a known 15-byte prologue at
; install time; a mismatch refuses the hook.
; v1.1.1.13; was 0x1854E0 in v1.1.1.9.
customhouse_tick_rva = 0x185500

; One line per resource added to a customhouse's trade storage, into
; tesmioloader.log. Verbose - leave off once your customhouses show what you
; expect.
probe = 0
