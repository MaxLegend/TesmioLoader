; needs - resources the citizens require. UTF-8, no BOM.
;
; Read by plugins\needs.dll, and it is the whole of that feature's
; configuration: [list] is what the citizens want, [needs] is how the plugin
; reaches the engine. Deleting the DLL removes the extra needs entirely - the
; base game's four are untouched either way.
;
; SAVES. A need adds a slot to every shop storage that stocks its donor, and a
; storage's slot list is part of the save. Test on a copy before committing a
; long game to it, exactly as with plugins\resources.ini.


; ---------------------------------------------------------------- what is wanted

;   <resource> = <donor resource>[, <amount factor>]
;
; resource  What the citizens are to want. Any name the engine knows - a
;           base-game resource, or one declared in plugins\resources.ini. Its
;           transport class has to be one the donor's shops can carry, which it
;           is automatically when the resource was cloned from the donor in
;           resources.ini.
;
; donor     An existing citizen demand, and the single key that drives both
;           halves of the feature:
;
;             the demand   is a byte-for-byte clone of the citizen's demand for
;                          the donor, with only the resource and the amounts
;                          changed - so it is routed to exactly the shops that
;                          already sell the donor.
;             the storage  slot is added to every storage the donor ended up in
;                          and this resource did not, which is those same shops.
;
;           Use `food` or `meat` for a grocery good ($STORAGE_DEMAND_BASIC),
;           `clothes` or `eletronics` for a department-store good
;           ($STORAGE_DEMAND_MEDIUM / _ADVANCED). Note the game's own spelling
;           of "eletronics".
;
; factor    How much of it, against what the donor demand asked for. 1.0 means
;           a citizen wants as much of it as they want electronics. Default 1.0.
;
; At most eight entries, and see max_demands below for the ceiling that really
; matters.
;
; A worked example. Add to plugins\resources.ini:
;
;     [list]
;     furniture = eletronics, Furniture
;
; which gives `furniture` electronics' transport class and cargo handling, then
; uncomment the line below. Shops that sell electronics start ordering
; furniture, trucks deliver it, and citizens buy it on the same trip.

[list]
furniture = eletronics, 1.0


; ---------------------------------------------------------------- the plugin

[needs]

; 0 unloads the plugin entirely.
enabled = 1

; Append the need to a citizen's demand list. Post-hook on the daily planner at
; rva 0x836960. Turn off to leave citizens alone and only stock the shops.
demand = 1

; Add the resource to every storage that stocks its donor. Post-hook on the
; storage builder at rva 0xE40F0, which runs while building.ini is parsed.
; Turn off if the shops are to be stocked some other way - without it the
; citizens will want the goods and never find them.
storage = 1

; How many demands a citizen may carry at once.
;
; **7 is a hard ceiling, not a preference.** The demand array starts at
; person+0x118 with a stride of 0x80 and the unsatisfied-demand count sits at
; person+0x4F0, so an eighth entry would run over it. A larger number here is
; clamped back to 7; a smaller one leaves the base game more headroom at the
; cost of the new need being skipped more often.
max_demands = 7

; What to do when the citizen already has max_demands.
;
;   skip     leave them alone this cycle. The need appears on the next plan
;            that has room, which is most of them - a citizen with an urgent
;            food demand carries no service demands at all and sits at four.
;   replace  take the donor's own entry for this cycle, so the citizen shops
;            for one of the two goods today and the other tomorrow.
when_full = skip

; Dump the first citizen's whole demand list and status block to the log once,
; to see what the planner actually produced. The fastest way to check that a
; new need is being appended and that the amounts are sane.
probe = 0

; Seconds between the "N demand(s) added" progress lines. 0 turns them off.
log_seconds = 60
