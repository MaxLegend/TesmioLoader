; resources - resources the base game does not have. UTF-8, no BOM.
;
; Read by plugins\resources.dll, and it is the whole of that feature's
; configuration: [list] is what exists, [resources] is how the plugin reaches
; the engine. Deleting the DLL removes mod resources entirely.
;
; SAVES ARE NOT COMPATIBLE ACROSS CHANGES TO [list]. The resource count is part
; of the save format: a save written with two mod resources will not load
; without them, and a stock save will not load with them.


; ---------------------------------------------------------------- what exists

;   <name> = [<slot index>,] <template resource>[, <display name>]
;
; slot     Optional, and better left out. The engine keeps its resources in one
;          global std::vector; the plugin waits until every base-game record has
;          landed and then claims the slots after them, in the order the entries
;          appear here. Writing a number instead pins the slot and is refused
;          unless it is exactly the next free one - which is what makes a
;          hard-coded 57 break the moment anything else claims it first.
;          Capacity runs to 63, so six mod resources fit before the vector
;          itself would have to be relocated.
;
; template An existing resource whose record is copied in as a starting point; a
;          freshly claimed record is otherwise all zeroes. Match the transport
;          class to what you intend - a storage whose class differs from the
;          resource's own reports zero capacity.
;
; display  Caption shown in the interface. The plugin mints a private
;          localisation id for it and answers C3D_LANGUAGE::GetString itself, so
;          no language file has to be touched. Omit to keep the template's.
;
; The name is also what building .ini files use in $PRODUCTION / $CONSUMPTION /
; $STORAGE lines.

[list]
copper_ore         = rawiron, Copper Ore
copper_concentrate = bauxite, Copper Ore Concentrate

raw_copper         = steel, Raw Copper
copper             = aluminium, Copper
copper2            = chemicals, Copper2


; ---------------------------------------------------------------- the plugin

[resources]

; Inline hook on the game's resource-name resolver.
;   0 = off, and the plugin unloads
;   1 = observe only  - record every name and the index it resolved to, into
;                       tesmioloader.resources.log
;   2 = observe + inject - additionally answer the names in [list] above
hook = 2

; Entry point of ResourceGet, relative to the SOVIET64.exe image base.
; Verified against a known prologue at install time; a mismatch aborts the hook.
resource_rva = 0x2AA7C0

; The global std::vector<Resource> that bounds every lookup. The plugin refuses
; to touch it unless its begin pointer matches the array it discovered at
; runtime.
resource_vector_rva = 0x9E11C0

; How many records the resource array should have room for.
;
; The engine allocates 63 and fills 57, so six mod resources fit without moving
; anything - leave this at 0 for that. A larger number makes the plugin
; reallocate the array the way reserve() would: a bigger block from the process
; heap, the existing records copied in, and the vector's three pointers
; repointed at it. The engine reads only those pointers, so it never notices.
;
; This is done on the very first lookup, before the engine's init loop has taken
; any pointer into the old buffer. The old block is left allocated on purpose.
;
; Caveat worth knowing before raising this: the resource vector is not the only
; table indexed by resource number. The icon set is another one, and there are
; likely more. Growing this array lets more resources exist; it does not make
; those other tables any bigger.
resource_capacity = 0
