; deposits - deposit types the base game does not have. UTF-8, no BOM.
;
; Read by plugins\deposits.dll. Which deposits exist is deposits.ini's business,
; in the loader's own folder; this file only says which subsystems the plugin is
; allowed to touch. Deleting the DLL removes mod deposits entirely - and with
; them the registry other plugins read, so depletion falls back to the base
; game's own five.

[deposits]

; Splice the declared deposit types into the executable, so their tokens work in
; building.ini and their mines find and size their deposits. This is the only
; part of the project that emits instructions; it verifies all three sites
; against the bytes v1.1.1.7 ships and refuses as a whole if any differs.
code_patch = 1

; Add a minimap button and overlay layer per deposit that asks for one, below
; the base game's five. Purely additive inline hooks on the button-row and
; overlay-draw functions; the vanilla buttons are untouched.
minimap = 1

; Add a paint/erase pair per deposit that asks for one to the terrain editor's
; Resources tab. Four additive inline hooks; the engine's own brush does the
; work, so no code is patched.
editor = 1
