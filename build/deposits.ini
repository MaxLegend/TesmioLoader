; Deposit types added by mods. This file is UTF-8, no BOM.
;
; One section per deposit. tesmioloader reads them once at startup and drives
; all three subsystems off the same table: the code patch that teaches the
; engine the type, the minimap layer, and the terrain editor's brush. Adding a
; deposit is adding a section here - no source change.
;
;   token          The building.ini token that selects this deposit, e.g.
;                  $TYPE_MINE_COPPER. Required. Use it in a mine's
;                  building.ini exactly like $TYPE_MINE_BAUXITE.
;
;   type           The deposit type number the engine keys everything on.
;                  Required, and must be 10 or above: 0-9 belong to the base
;                  game. The upper bound is 127, because every comparison the
;                  patch splices in takes a sign-extended imm8.
;
;   map            resourcemap or resourcemap2. Both are 1024x1024 BGRA
;                  textures that ship with every terrain; the game keeps one
;                  deposit per colour channel and stores richness as the byte
;                  value. Default resourcemap2.
;
;   component      0-3, which channel of that map. Required.
;
;   building_type  What the parser sets alongside the deposit type. 7 is a
;                  mine, which is almost certainly what you want; water wells
;                  are 92. Default 7.
;
;   radius         How far the mine searches for its deposit. Naming one of the
;                  game's own constants - oil, ore, bauxite, gravel, wood,
;                  water, watersurface - copies its value at startup, so the
;                  mod tracks the game if a patch ever changes it. A number is
;                  taken literally. Default ore, which iron, coal and uranium
;                  share.
;
;                  This is not optional in practice. A type the radius table
;                  does not know searches nothing, the average over an empty
;                  set is NaN, and the building window shows quality of source
;                  as -2147483648.
;
;   icon           Resource whose icon the minimap button uses, taken straight
;                  out of its record - so a resource registered in
;                  resources.ini needs no extra art. Omit for no icon.
;
;   minimap        1 to add a minimap button and overlay layer, 0 for none.
;                  Default 1.
;
;   editor         Base name for the terrain editor's paint/erase pair:
;                  "copper" gives paint_copper and erase_copper, drawn with
;                  vfs/media_soviet/editor/tool_paint_copper.png and
;                  tool_erase_copper.png. Omit for no brush.
;
;                  At most SEVEN characters. The tool name is written over a
;                  clone of paint_bauxite's, and a longer string would not fit
;                  the descriptor field.
;
;   deplete        Only read when deplete = 1 in tesmioloader.ini. A number is
;                  the tonnes of mine output one fully saturated texel of this
;                  deposit is worth, overriding deplete_tonnes_per_texel; 0
;                  exempts the deposit and leaves it infinite. Omit to take the
;                  global figure.
;
;
; WHICH CHANNELS ARE ACTUALLY FREE
;
; Eight exist. Measured over every shipped map - campaign1, campaign2,
; terrain3-6, terrain_svk, terrainblank and all eighteen tutorial maps:
;
;   resourcemap  component 0   oil        taken
;   resourcemap  component 1   iron       taken
;   resourcemap  component 2   coal       taken
;   resourcemap  component 3   -          FREE, but see below
;   resourcemap2 component 0   uranium    taken
;   resourcemap2 component 1   bauxite    taken
;   resourcemap2 component 2   -          carries data on about half the maps,
;                                         and the minimap has a sixth layer
;                                         flag for it with no button. Avoid.
;   resourcemap2 component 3   copper     taken by the section below
;
; resourcemap component 3 holds no spatial data on any shipped map: it is
; either all 255 or all 0, never anything in between, which is what an unused
; alpha channel looks like. It is usable, with one caveat - on the maps where
; it is 255 a deposit assigned to it reads as maximum richness everywhere until
; something clears it. Paint over it in the editor, or ship a replacement map
; through the VFS.
;
; Past those two there are no channels left, and a third resource map would
; have to be created and saved by the loader itself.


[copper]
token         = $TYPE_MINE_COPPER
type          = 10
map           = resourcemap2
component     = 3
radius        = ore
building_type = 7
icon          = copper_ore
minimap       = 1
editor        = copper
