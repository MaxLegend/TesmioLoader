[tesmioloader]

; File access tracing into tesmioloader.reads.log
;   0 = off, 1 = only paths containing trace_filter, 2 = everything
trace_reads = 1
trace_filter = resourcemap

; Mirror the game's own C3DLog_Print* output into tesmioloader.log
log_game = 1

; Redirect reads to tesmioloader\vfs\<same relative path> when a file exists there
vfs = 1

; Inline hook on the game's resource-name resolver
;   0 = off
;   1 = observe only  - record every name and the index it resolved to
;   2 = observe + inject - additionally answer names listed in resources.ini
resourcehook = 2

; Entry point of ResourceGet, relative to the SOVIET64.exe image base.
; Verified against a known prologue at install time; a mismatch aborts the hook.
resource_rva = 0x2AA7C0

; The global std::vector<Resource> that bounds every lookup. tesmioloader refuses to
; touch it unless its begin pointer matches the array it discovered at runtime.
resource_vector_rva = 0x9E11C0

; How many records the resource array should have room for.
;
; The engine allocates 63 and fills 57, so six mod resources fit without moving
; anything - leave this at 0 for that. A larger number makes tesmioloader
; reallocate the array the way reserve() would: a bigger block from the process
; heap, the existing records copied in, and the vector's three pointers
; repointed at it. The engine reads only those pointers, so it never notices.
;
; This is done on the very first lookup, before the engine's init loop has taken
; any pointer into the old buffer. The old block is left allocated on purpose.
;
; Caveat worth knowing before raising this: the resource vector is not the only
; table indexed by resource number. The icon set is another one, and there are
; likely more. Growing this array lets more resources exist; it does not make
; those other tables any bigger.
resource_capacity = 0

; Locate the deposit map in memory by its marker, guard those pages and
; log every instruction that reads it. Diagnostic only - leave off normally.
probe_map = 0

; Watch the game read individual texels out of the deposit map textures.
probe_texel = 1

; All three switches below drive the same registry: the deposits declared in
; deposits.ini. Which deposits exist is that file's business; these only say
; which subsystems tesmioloader is allowed to touch.

; Splice the declared deposit types into the executable, so their tokens work
; in building.ini and their mines find, size and deplete their deposits.
deposit_patch = 1

; Add a minimap button and overlay layer per deposit that asks for one, below
; the base game's five. Purely additive inline hooks on the button-row and
; overlay-draw functions; the vanilla buttons are untouched.
minimap_patch = 1

; Add a paint/erase pair per deposit that asks for one to the terrain editor's
; Resources tab. Four additive inline hooks; the engine's own brush does the
; work, so no code is patched.
editor_patch = 1

; Append menu_tag to the version line along the bottom of the main menu, the one
; that reads "v1.1.1.7 (64 bit DX11.1 - GPU: ...)". Done by repointing the one
; LEA that computes that format string at a copy of it with the tag on the end,
; so nothing is hooked and no other text in the game is affected. The patch
; verifies the string the LEA currently resolves to and refuses if it is not the
; one this build ships.
menu_patch = 1

; ASCII only. This file is UTF-8 but the tag is read through the ANSI profile
; API, so anything past 0x7F would arrive as its raw bytes. Empty leaves the
; version line untouched.
menu_tag = tsmloader v.a0.1.
